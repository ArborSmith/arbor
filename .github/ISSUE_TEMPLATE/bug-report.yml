name: Bug report
description: Something is broken or behaves incorrectly
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Which component
      description: Where does the bug live?
      options:
        - plugin (UE5 C++ / Python)
        - bridge (MCP / TypeScript)
        - both
        - not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's broken? What did you expect to happen?
      placeholder: e.g. "snap_to_ground corrupts actor rotation when sweep fallback triggers."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps that demonstrate the issue
      placeholder: |
        1. Spawn an actor at (0, 0, 1000)
        2. Call `ue5_actors(action="snap_to_ground")` on it
        3. Observe rotation has been zeroed
    validations:
      required: false

  - type: textarea
    id: error
    attributes:
      label: Error message / log output
      render: shell
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: UE5 version + Node version + OS
      placeholder: "UE 5.4.4, Node 20.11, Windows 11"
    validations:
      required: false
